<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Queue · School Radio Admin</title>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="admin-body">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <div class="app-content">
        <section class="card">
          <div class="card-title">
            <div><span class="eyebrow" style="margin:0">Playback order</span><h2 style="font-size:19px;margin:2px 0 0">Approved queue</h2></div>
            <div class="row" style="gap:8px"><span class="badge" id="queue-count">—</span><button class="btn btn-ghost btn-sm" id="refresh-btn" type="button">Refresh</button></div>
          </div>
          <p class="help" style="margin-top:-6px">Reorder with the arrows. The player picks the first approved track when it is ready for the next song.</p>
          <div id="queue-list" class="stack" style="margin-top:14px">
            <div class="skeleton" style="height:78px"></div>
            <div class="skeleton" style="height:78px"></div>
            <div class="skeleton" style="height:78px"></div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="/assets/vendor/supabase.js"></script>
  <script type="module" src="/assets/js/admin-queue.js"></script>
</body>
</html>
