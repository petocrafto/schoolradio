<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Song requests · School Radio Admin</title>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="admin-body">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <div class="app-content">
        <div class="card card-flat" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <div class="row" style="gap:6px" role="tablist" aria-label="Request filter">
            <button class="btn btn-sm" id="tab-pending" data-tab="pending" type="button" aria-selected="true">Pending</button>
            <button class="btn btn-secondary btn-sm" id="tab-approved" data-tab="approved" type="button" aria-selected="false">Approved</button>
          </div>
          <div class="spacer"></div>
          <button class="btn btn-ghost btn-sm" id="refresh-btn" type="button">Refresh</button>
        </div>

        <section class="card">
          <div class="card-title"><h2 style="font-size:19px" id="list-title">Requests awaiting review</h2><span class="badge" id="list-count">—</span></div>
          <div id="request-list" class="stack">
            <div class="skeleton" style="height:78px"></div>
            <div class="skeleton" style="height:78px"></div>
            <div class="skeleton" style="height:78px"></div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="/assets/vendor/supabase.js"></script>
  <script type="module" src="/assets/js/admin-requests.js"></script>
</body>
</html>
